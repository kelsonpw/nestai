services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nestai-postgres
    environment:
      POSTGRES_USER: nestai
      POSTGRES_PASSWORD: nestai
      POSTGRES_DB: nestai
    ports:
      - '5432:5432'
    volumes:
      - nestai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestai -d nestai']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nestai-redis
    ports:
      - '6379:6379'
    volumes:
      - nestai-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nestai-pgdata:
  nestai-redisdata:
