name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      PROVIDER_MODE: mock
      DATABASE_URL: postgresql://nestai:nestai@localhost:5432/nestai
      PORT: '3000'

    services:
      postgres:
        # pgvector-enabled Postgres 16 (GitHub runners can pull images).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nestai
          POSTGRES_PASSWORD: nestai
          POSTGRES_DB: nestai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestai -d nestai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build (all packages)
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint
        continue-on-error: true

      - name: Apply migrations (prisma migrate deploy)
        run: pnpm db:migrate

      - name: Seed database (The Rivera Family)
        run: pnpm db:seed

      - name: Test (all packages)
        run: pnpm -r test

      - name: Acceptance demo (end-to-end)
        run: pnpm demo
